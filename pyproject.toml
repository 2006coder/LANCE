[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lance-enzyme-kinetics"
version = "0.1.0.dev0"
description = "Research code for multitask enzyme-kinetics prediction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "torch>=2.5", "rdkit"]

[tool.setuptools.packages.find]
include = ["LANCE*"]
